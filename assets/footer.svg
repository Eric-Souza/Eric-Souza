<svg xmlns="http://www.w3.org/2000/svg" width="880" height="64" viewBox="0 0 880 64">
<style>
  .sans { font-family: -apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .cursor { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
</style>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#58A6FF"/>
    <stop offset="1" stop-color="#BC8CFF"/>
  </linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#30363D" stroke-opacity="0.35" stroke-width="1"/>
  </pattern>
</defs>
<text x="440" y="32" class="mono" font-size="14" fill="#8B949E" text-anchor="middle" dominant-baseline="central"><tspan fill="#7EE787">➜</tspan> open to interesting problems and great teams<tspan class="cursor" fill="#58A6FF"> ▍</tspan></text>
</svg>
