<rect x="0.5" y="0.5" width="879" height="223" rx="14" fill="#161B22" stroke="#30363D"/><rect x="1" y="24" width="3" height="176" rx="1.5" fill="url(#accent)"/><text x="36" y="42" class="mono" font-size="12" fill="#7EE787">04<tspan fill="#8B949E" dx="10">// LLM Agent · RAG</tspan></text><text x="844" y="42" class="mono" font-size="12" fill="#8B949E" text-anchor="end">Eric-Souza/job-application-copilot <tspan fill="#58A6FF">↗</tspan></text><text x="36" y="80" class="sans" font-size="24" font-weight="700" fill="#E6EDF3">Job Application Copilot</text><text x="36" y="112" class="sans" font-size="15" fill="#C9D1D9">LangGraph agent that tailors a resume to a job posting. Every bullet cites resume evidence, and a</text><text x="36" y="136" class="sans" font-size="15" fill="#C9D1D9">person reviews the draft before it's final. Streams each step to a React UI.</text><rect x="36" y="166" width="67" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="69.5" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">Python</text><rect x="111" y="166" width="89" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="155.5" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">LangGraph</text><rect x="208" y="166" width="75" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="245.5" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">FastAPI</text><rect x="291" y="166" width="67" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="324.5" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">Gemini</text><rect x="366" y="166" width="82" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="407" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">pgvector</text><rect x="456" y="166" width="82" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="497" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">Postgres</text><rect x="546" y="166" width="60" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="576" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">React</text><rect x="614" y="166" width="97" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="662.5" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">TypeScript</text>
