<rect x="0.5" y="0.5" width="879" height="223" rx="14" fill="#161B22" stroke="#30363D"/><rect x="1" y="24" width="3" height="176" rx="1.5" fill="url(#accent)"/><text x="36" y="42" class="mono" font-size="12" fill="#7EE787">01<tspan fill="#8B949E" dx="10">// Vision Extraction · Evals</tspan></text><text x="844" y="42" class="mono" font-size="12" fill="#8B949E" text-anchor="end">Eric-Souza/doc-extraction-copilot <tspan fill="#58A6FF">↗</tspan></text><text x="36" y="80" class="sans" font-size="24" font-weight="700" fill="#E6EDF3">Doc Extraction Copilot</text><text x="36" y="112" class="sans" font-size="15" fill="#C9D1D9">Gemini reads photos and PDFs of Brazilian boletos, notas fiscais and income statements into typed</text><text x="36" y="136" class="sans" font-size="15" fill="#C9D1D9">JSON. Code checks CPFs, CNPJs, digit lines, NF-e keys and totals; a person reviews only what fails.</text><rect x="36" y="166" width="97" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="84.5" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">TypeScript</text><rect x="141" y="166" width="76" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="179.0" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">Next.js</text><rect x="225" y="166" width="119" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="284.5" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">Vercel AI SDK</text><rect x="352" y="166" width="68" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="386.0" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">Gemini</text><rect x="428" y="166" width="48" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="452.0" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">Zod</text><rect x="484" y="