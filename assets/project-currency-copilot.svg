<rect x="0.5" y="0.5" width="879" height="223" rx="14" fill="#161B22" stroke="#30363D"/><rect x="1" y="24" width="3" height="176" rx="1.5" fill="url(#accent)"/><text x="36" y="42" class="mono" font-size="12" fill="#7EE787">04<tspan fill="#8B949E" dx="10">// Generative UI · Tool Calling</tspan></text><text x="844" y="42" class="mono" font-size="12" fill="#8B949E" text-anchor="end">Eric-Souza/currency-copilot <tspan fill="#58A6FF">↗</tspan></text><text x="36" y="80" class="sans" font-size="24" font-weight="700" fill="#E6EDF3">Currency Copilot</text><text x="36" y="112" class="sans" font-size="15" fill="#C9D1D9">Streaming currency chat where every rate comes from a typed tool call and renders as a React</text><text x="36" y="136" class="sans" font-size="15" fill="#C9D1D9">rate card, chart, or table. The exchange verdict is computed in code; chats are saved in Neon.</text><rect x="36" y="166" width="97" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="84.5" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">TypeScript</text><rect x="141" y="166" width="76" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="179.0" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">Next.js</text><rect x="225" y="166" width="119" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="284.5" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">Vercel AI SDK</text><rect x="352" y="166" width="68" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="386.0" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">Gemini</text><rect x="428" y="166" width="119" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="487.5" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">Neon Postgres</text><rect x="555" y="166" width="76" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="593.0" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">Drizzle</text><rect x="639" y="166" width="97" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="687.5" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">Playwright</text>
