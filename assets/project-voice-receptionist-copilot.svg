<rect x="0.5" y="0.5" width="879" height="223" rx="14" fill="#161B22" stroke="#30363D"/><rect x="1" y="24" width="3" height="176" rx="1.5" fill="url(#accent)"/><text x="36" y="42" class="mono" font-size="12" fill="#7EE787">01<tspan fill="#8B949E" dx="10">// Voice Agent · Tool Calling</tspan></text><text x="844" y="42" class="mono" font-size="12" fill="#8B949E" text-anchor="end">Eric-Souza/voice-receptionist-copilot <tspan fill="#58A6FF">↗</tspan></text><text x="36" y="80" class="sans" font-size="24" font-weight="700" fill="#E6EDF3">Voice Receptionist Copilot</text><text x="36" y="112" class="sans" font-size="15" fill="#C9D1D9">Voice receptionist for a dental clinic that you can interrupt mid-sentence. Whisper hears, gpt-oss</text><text x="36" y="136" class="sans" font-size="15" fill="#C9D1D9">books through tools, Kokoro speaks on the CPU, and a dashboard shows every tool call and its latency.</text><rect x="36" y="166" width="67" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="69.5" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">Python</text><rect x="111" y="166" width="75" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="148.5" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">FastAPI</text><rect x="194" y="166" width="97" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="242.5" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">WebSockets</text><rect x="299" y="166" width="52" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="325.0" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">Groq</text><rect x="359" y="166" width="75" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="396.5" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">Whisper</text><rect x="442" y="166" width="97" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="490.5" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">Silero VAD</text><rect x="547" y="166" width="97" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="595.5" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">Kokoro TTS</text><rect x="652" y="166" width="60" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="682.0" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">React</text><rect x="720" y="166" width="97" height="26" rx="13" fill="#1C2230" stroke="#30363D"/><text x="768.5" y="179" class="mono" font-size="12" fill="#C9D1D9" text-anchor="middle" dominant-baseline="central">TypeScript</text>
