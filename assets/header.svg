<radialGradient id="g2" cx="0.1" cy="1" r="0.6"><stop offset="0" stop-color="#58A6FF" stop-opacity="0.22"/><stop offset="1" stop-color="#58A6FF" stop-opacity="0"/></radialGradient>
<rect class="glow" x="1" y="1" width="878" height="248" rx="14" fill="url(#g1)"/>
<rect class="glow" x="1" y="1" width="878" height="248" rx="14" fill="url(#g2)"/>
<path d="M1 44H879" stroke="#30363D"/>
