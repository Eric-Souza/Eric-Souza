<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250">
<style>
  .sans { font-family: -apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .role { opacity: 0; animation: cycle 12s infinite; }
  .r0 { opacity: 1; }
  .r0 { animation-delay: 0s; }
  .r1 { animation-delay: 3s; }
  .r2 { animation-delay: 6s; }
  .r3 { animation-delay: 9s; }
  @keyframes cycle { 0% { opacity: 0; transform: translateY(6px); } 3% { opacity: 1; transform: translateY(0); } 22% { opacity: 1; } 25% { opacity: 0; } 100% { opacity: 0; } }
  .cursor { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
  .glow { animation: pulse 6s ease-in-out infinite; } @keyframes pulse { 50% { opacity: 0.55; } }
</style>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#58A6FF"/>
    <stop offset="1" stop-color="#BC8CFF"/>
  </linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#30363D" stroke-opacity="0.35" stroke-width="1"/>
  </pattern>
</defs>

<rect x="0.5" y="0.5" width="879" height="249" rx="14" fill="#0D1117" stroke="#30363D"/>
<rect x="1" y="1" width="878" height="248" rx="14" fill="url(#grid)"/>
