name: Latest Medium articles

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@eric.bh18souza"
          max_post_count: 5
          template: "<tr><td><a href=\"$url\">$title</a></td><td><code>$date</code></td></tr>$newline"
          date_format: "yyyy-mm-dd"
          commit_message: "Update latest Medium articles"
